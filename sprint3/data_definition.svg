<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="'Segoe UI', Meiryo, sans-serif">

  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="106%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000012"/>
    </filter>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0.5 L 10 5 L 0 9.5 z" fill="#2563eb"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0.5 L 10 5 L 0 9.5 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="700" rx="10" fill="#f8fafc"/>

  <!-- 凡例 -->
  <rect x="25" y="18" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="44" y="30" fill="#1e3a5f" font-size="11" font-weight="600">ディメンション（マスタ）</text>
  <rect x="195" y="18" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="214" y="30" fill="#14532d" font-size="11" font-weight="600">ファクト（実績）</text>
  <line x1="340" y1="25" x2="378" y2="25" stroke="#64748b" stroke-width="2"/>
  <polygon points="380,25 372,20 372,30" fill="#64748b"/>
  <text x="388" y="30" fill="#64748b" font-size="11">リレーション（1:多）</text>

  <!-- 階層ラベル -->
  <text x="870" y="58" text-anchor="end" fill="#cbd5e1" font-size="10" font-style="italic">マスタ層</text>
  <text x="870" y="298" text-anchor="end" fill="#cbd5e1" font-size="10" font-style="italic">トランザクション層</text>
  <text x="870" y="520" text-anchor="end" fill="#cbd5e1" font-size="10" font-style="italic">明細層</text>

  <!-- ================================================================ -->
  <!--  上段: ディメンション (y=70)                                      -->
  <!-- ================================================================ -->

  <!-- dim_parts (x=20) -->
  <g filter="url(#shadow)">
    <rect x="20" y="70" width="170" height="70" rx="8" fill="white" stroke="#93c5fd" stroke-width="1"/>
    <rect x="20" y="70" width="170" height="26" rx="8" fill="#3b82f6"/>
    <rect x="20" y="88" width="170" height="8" fill="#3b82f6"/>
    <text x="105" y="88" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">dim_parts</text>
    <text x="105" y="110" text-anchor="middle" fill="#1e40af" font-size="11">部材マスタ</text>
    <text x="105" y="126" text-anchor="middle" fill="#6b7280" font-size="10">PK: part_id ｜ 20件</text>
  </g>

  <!-- dim_products (x=230) -->
  <g filter="url(#shadow)">
    <rect x="230" y="70" width="170" height="70" rx="8" fill="white" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="70" width="170" height="26" rx="8" fill="#3b82f6"/>
    <rect x="230" y="88" width="170" height="8" fill="#3b82f6"/>
    <text x="315" y="88" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">dim_products</text>
    <text x="315" y="110" text-anchor="middle" fill="#1e40af" font-size="11">製品マスタ</text>
    <text x="315" y="126" text-anchor="middle" fill="#6b7280" font-size="10">PK: product_id ｜ 5件</text>
  </g>

  <!-- dim_processes (x=450) -->
  <g filter="url(#shadow)">
    <rect x="450" y="70" width="170" height="70" rx="8" fill="white" stroke="#93c5fd" stroke-width="1"/>
    <rect x="450" y="70" width="170" height="26" rx="8" fill="#3b82f6"/>
    <rect x="450" y="88" width="170" height="8" fill="#3b82f6"/>
    <text x="535" y="88" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">dim_processes</text>
    <text x="535" y="110" text-anchor="middle" fill="#1e40af" font-size="11">製造工程マスタ</text>
    <text x="535" y="126" text-anchor="middle" fill="#6b7280" font-size="10">PK: process_id ｜ 6件</text>
  </g>

  <!-- dim_workers (x=650, 左に40px移動) -->
  <g filter="url(#shadow)">
    <rect x="650" y="70" width="170" height="70" rx="8" fill="white" stroke="#93c5fd" stroke-width="1"/>
    <rect x="650" y="70" width="170" height="26" rx="8" fill="#3b82f6"/>
    <rect x="650" y="88" width="170" height="8" fill="#3b82f6"/>
    <text x="735" y="88" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">dim_workers</text>
    <text x="735" y="110" text-anchor="middle" fill="#1e40af" font-size="11">作業者マスタ</text>
    <text x="735" y="126" text-anchor="middle" fill="#6b7280" font-size="10">PK: worker_id ｜ 12件</text>
  </g>

  <!-- ================================================================ -->
  <!--  中段: ファクト (y=310/300)  左に移動                              -->
  <!-- ================================================================ -->

  <!-- fact_production_orders (x=220, 左に50px) -->
  <g filter="url(#shadow)">
    <rect x="220" y="310" width="195" height="86" rx="8" fill="white" stroke="#86efac" stroke-width="1"/>
    <rect x="220" y="310" width="195" height="26" rx="8" fill="#16a34a"/>
    <rect x="220" y="328" width="195" height="8" fill="#16a34a"/>
    <text x="317" y="328" text-anchor="middle" fill="white" font-size="11" font-weight="bold">fact_production_orders</text>
    <text x="317" y="350" text-anchor="middle" fill="#15803d" font-size="11">製造指示</text>
    <text x="317" y="366" text-anchor="middle" fill="#6b7280" font-size="10">PK: order_id ｜ 15件</text>
    <text x="317" y="382" text-anchor="middle" fill="#6b7280" font-size="9.5">FK: product_id</text>
  </g>

  <!-- fact_process_results (x=460, 左に50px) -->
  <g filter="url(#shadow)">
    <rect x="460" y="300" width="220" height="100" rx="8" fill="white" stroke="#86efac" stroke-width="2.5"/>
    <rect x="460" y="300" width="220" height="26" rx="8" fill="#16a34a"/>
    <rect x="460" y="318" width="220" height="8" fill="#16a34a"/>
    <text x="570" y="318" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">fact_process_results</text>
    <text x="570" y="342" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">工程作業実績（中心テーブル）</text>
    <text x="570" y="358" text-anchor="middle" fill="#6b7280" font-size="10">PK: result_id ｜ 25件</text>
    <text x="570" y="374" text-anchor="middle" fill="#6b7280" font-size="9.5">FK: order_id / process_id / worker_id</text>
    <text x="570" y="390" text-anchor="middle" fill="#9ca3af" font-size="9">※ 全ファクトの結合点</text>
  </g>

  <!-- ================================================================ -->
  <!--  下段: 明細ファクト (y=530)                                       -->
  <!-- ================================================================ -->

  <!-- fact_parts_usage (x=220, 左に50px) -->
  <g filter="url(#shadow)">
    <rect x="220" y="530" width="195" height="86" rx="8" fill="white" stroke="#86efac" stroke-width="1"/>
    <rect x="220" y="530" width="195" height="26" rx="8" fill="#16a34a"/>
    <rect x="220" y="548" width="195" height="8" fill="#16a34a"/>
    <text x="317" y="548" text-anchor="middle" fill="white" font-size="11" font-weight="bold">fact_parts_usage</text>
    <text x="317" y="570" text-anchor="middle" fill="#15803d" font-size="11">部材使用実績</text>
    <text x="317" y="586" text-anchor="middle" fill="#6b7280" font-size="10">PK: usage_id ｜ 29件</text>
    <text x="317" y="600" text-anchor="middle" fill="#6b7280" font-size="9.5">FK: result_id / part_id</text>
  </g>

  <!-- fact_quality_inspections (x=560, 右に40px) -->
  <g filter="url(#shadow)">
    <rect x="560" y="530" width="210" height="86" rx="8" fill="white" stroke="#86efac" stroke-width="1"/>
    <rect x="560" y="530" width="210" height="26" rx="8" fill="#16a34a"/>
    <rect x="560" y="548" width="210" height="8" fill="#16a34a"/>
    <text x="665" y="548" text-anchor="middle" fill="white" font-size="10.5" font-weight="bold">fact_quality_inspections</text>
    <text x="665" y="570" text-anchor="middle" fill="#15803d" font-size="11">品質検査結果</text>
    <text x="665" y="586" text-anchor="middle" fill="#6b7280" font-size="10">PK: inspection_id ｜ 20件</text>
    <text x="665" y="600" text-anchor="middle" fill="#6b7280" font-size="9.5">FK: result_id / inspector_id</text>
  </g>

  <!-- ================================================================ -->
  <!--  リレーション線（全カードの後に描画＝最前面）                       -->
  <!-- ================================================================ -->

  <!-- R-01: dim_products(315) → fact_production_orders(317) -->
  <line x1="315" y1="140" x2="316" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
  <rect x="270" y="210" width="74" height="30" rx="5" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="307" y="222" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">1 : 多</text>
  <text x="307" y="235" text-anchor="middle" fill="#6b7280" font-size="9">product_id</text>

  <!-- R-02: fact_production_orders(415) → fact_process_results(460) -->
  <line x1="415" y1="353" x2="460" y2="350" stroke="#15803d" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="420" y="332" width="36" height="30" rx="5" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="438" y="344" text-anchor="middle" fill="#15803d" font-size="8.5" font-weight="600">1:多</text>
  <text x="438" y="356" text-anchor="middle" fill="#6b7280" font-size="7.5">order_id</text>

  <!-- R-03: dim_processes(535) → fact_process_results(530) -->
  <line x1="535" y1="140" x2="532" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
  <rect x="498" y="205" width="72" height="30" rx="5" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="534" y="217" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">1 : 多</text>
  <text x="534" y="230" text-anchor="middle" fill="#6b7280" font-size="9">process_id</text>

  <!-- R-04: dim_workers(710) → fact_process_results(650) -->
  <line x1="710" y1="140" x2="650" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
  <rect x="650" y="200" width="70" height="30" rx="5" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="685" y="212" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">1 : 多</text>
  <text x="685" y="225" text-anchor="middle" fill="#6b7280" font-size="9">worker_id</text>

  <!-- R-05: fact_process_results(530) → fact_parts_usage(370) -->
  <line x1="530" y1="400" x2="370" y2="530" stroke="#15803d" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="418" y="448" width="64" height="30" rx="5" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="450" y="460" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600">1 : 多</text>
  <text x="450" y="473" text-anchor="middle" fill="#6b7280" font-size="9">result_id</text>

  <!-- R-06: dim_parts(105) → fact_parts_usage(220) -->
  <line x1="105" y1="140" x2="220" y2="560" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#aB)"/>
  <rect x="110" y="340" width="62" height="30" rx="5" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="141" y="352" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">1 : 多</text>
  <text x="141" y="365" text-anchor="middle" fill="#6b7280" font-size="9">part_id</text>

  <!-- R-07: fact_process_results(610) → fact_quality_inspections(630) -->
  <line x1="610" y1="400" x2="630" y2="530" stroke="#15803d" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="596" y="448" width="64" height="30" rx="5" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="628" y="460" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600">1 : 多</text>
  <text x="628" y="473" text-anchor="middle" fill="#6b7280" font-size="9">result_id</text>

  <!-- R-08: dim_workers(760) → fact_quality_inspections(740) -->
  <line x1="760" y1="140" x2="740" y2="530" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#aB)"/>
  <rect x="738" y="330" width="76" height="30" rx="5" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="776" y="342" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">1 : 多</text>
  <text x="776" y="355" text-anchor="middle" fill="#6b7280" font-size="9">inspector_id</text>

</svg>